
services:
  backend:
    container_name: yt-converter-backend

    build:
      context: .
      dockerfile: Dockerfile

    image: yt-converter-backend:local

    ports:
      - "127.0.0.1:3333:3333"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3333"
      MAX_CONCURRENT_CONVERSIONS: "1"

    restart: unless-stopped

    cpus: 1.5
    mem_limit: 2g

    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
